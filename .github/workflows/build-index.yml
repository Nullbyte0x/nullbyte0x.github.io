name: Build post index

on:
  push:
    branches: [main]
    paths:
      - "posts/**"
      - "build-index.js"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-post-index
  cancel-in-progress: true

jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate posts/index.json
        run: node build-index.js

      - name: Commit manifest if changed
        run: |
          if git diff --quiet -- posts/index.json; then
            echo "No manifest changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posts/index.json
          git commit -m "chore: rebuild post index"
          git push
